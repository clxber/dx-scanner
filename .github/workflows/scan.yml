        continue-on-error: true
        uses: actions/download-artifact@v7
        with: { name: shard-5-files, path: artifacts, merge-multiple: true }
      - name: 下载 shard-6 artifact
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with: { name: shard-6-files, path: artifacts, merge-multiple: true }
      - name: 下载 shard-7 artifact
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with: { name: shard-7-files, path: artifacts, merge-multiple: true }

      - name: 从 Artifact 恢复缺失文件
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        run: |
          if [ -d artifacts ]; then
            for f in artifacts/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              if [ ! -f "$base" ]; then
                cp "$f" "$base"
              fi
            done
          fi

      - name: 合并结果
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '30000' }}
          PROXY_THRESHOLD: ${{ github.event.inputs.proxy_threshold || '1' }}
        run: python merge_shards.py

      - name: 提交合并（极限抗断网版）
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        run: |
          # 1. 给 Git 穿上防弹衣
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300
          
          git add -A
          git diff --staged --quiet || git commit -m "合并 [skip ci]"
          git stash -u 2>/dev/null || true
          
          # 2. 极限重试：12次，线性递增，单次封顶15分钟。总容错约 3.2 小时！
          success=false
          for i in $(seq 1 12); do
            if git pull origin main --rebase && git push; then
              success=true; break
            fi
            git rebase --abort 2>/dev/null || true
            WAIT=$((i * 300))
            if [ $WAIT -gt 900 ]; then WAIT=900; fi
            echo "⚠️ 网络波动，git 失败。重试 $i/12，等待 ${WAIT} 秒(约 $((WAIT/60)) 分钟)..."
            sleep $WAIT
          done
          [ "$success" = "true" ] || exit 1

      - name: 触发下一轮（极限抗断网版）
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        run: |
          FLAG="$RUNNER_TEMP/trigger.flag"
          if [ -f "$FLAG" ] && [ "$(cat "$FLAG")" = "yes" ]; then
            echo "🔄 准备触发下一轮 workflow..."
            success=false
            # 重试 12 次，与 git 保持同等强度的抗断网能力
            for i in $(seq 1 12); do
              if gh workflow run scan.yml --ref main \
                -f batch_size="${{ github.event.inputs.batch_size || '30000' }}" \
                -f full_batch_size="${{ github.event.inputs.full_batch_size || '10' }}" \
                -f total_max_requests="${{ github.event.inputs.total_max_requests || '5500000' }}" \
                -f proxy_threshold="${{ github.event.inputs.proxy_threshold || '1' }}"; then
                success=true
                break
              fi
              WAIT=$((i * 300))
              if [ $WAIT -gt 900 ]; then WAIT=900; fi
              echo "⚠️ gh 命令超时，重试 $i/12，等待 ${WAIT} 秒(约 $((WAIT/60)) 分钟)..."
              sleep $WAIT
            done
            if [ "$success" = "false" ]; then
              echo "❌ 12次重试全失败，网络极度不稳定，请手动触发下一轮。数据已安全保存！"
              exit 1
            fi
          else
            echo "✅ 结束，等待手动触发"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传最终 Artifact
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: working-proxies-${{ github.run_id }}
          path: |
            working_proxies.txt
            phase.json
            alive_ip_ranges.txt
            alive_ips.txt
