  merge:
    needs: [shard-0, shard-1, shard-2, shard-3, shard-4, shard-5, shard-6, shard-7]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase

      - name: 检查是否被手动取消
        id: check_cancel
        if: always()
        run: |
          if [ "${{ needs.shard-0.result }}" = "cancelled" ] || \
             [ "${{ needs.shard-1.result }}" = "cancelled" ] || \
             [ "${{ needs.shard-2.result }}" = "cancelled" ] || \
             [ "${{ needs.shard-3.result }}" = "cancelled" ] || \
             [ "${{ needs.shard-4.result }}" = "cancelled" ] || \
             [ "${{ needs.shard-5.result }}" = "cancelled" ] || \
             [ "${{ needs.shard-6.result }}" = "cancelled" ] || \
             [ "${{ needs.shard-7.result }}" = "cancelled" ]; then
            echo "is_cancelled=true" >> $GITHUB_OUTPUT
            echo "⚠️ 检测到分片被手动取消，将执行清理。"
          else
            echo "is_cancelled=false" >> $GITHUB_OUTPUT
            echo "✅ 正常结束，继续合并流程。"
          fi

      - name: 清理残留文件（仅在取消时）
        if: always() && steps.check_cancel.outputs.is_cancelled == 'true'
        run: |
          rm -f progress_shard*.json
          rm -f open_ips_shard*.txt
          rm -f proxy_ips_shard*.txt
          rm -f open_ips_revalidated_shard*.txt
          rm -f proxy_missing_shard*.txt
          rm -f working_proxies_shard*.txt
          rm -f full_cursor_shard*.json
          rm -f full_alive_shard*.txt
          rm -f phase.json
          rm -f alive_ips.txt
          rm -f scan_finished.flag
          git add -A
          git diff --staged --quiet || git commit -m "手动取消扫描，清理残留 [skip ci]"
          git push || true

      - name: 下载 shard-0 artifact
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with: { name: shard-0-files, path: artifacts, merge-multiple: true }
      - name: 下载 shard-1 artifact
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with: { name: shard-1-files, path: artifacts, merge-multiple: true }
      - name: 下载 shard-2 artifact
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with: { name: shard-2-files, path: artifacts, merge-multiple: true }
      - name: 下载 shard-3 artifact
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with: { name: shard-3-files, path: artifacts, merge-multiple: true }
      - name: 下载 shard-4 artifact
        if: always() && steps.check_cancel.outputs.is_cancelled == 'false'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with: { name: shard-4-files, path: artifacts, merge-multiple: true }
      - name: 下载 shard-5 artifact
