name: Scan Proxies

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'common 阶段每次触发的 IP 数量（均分给8个分片）'
        required: false
        default: '30000'
      full_batch_size:
        description: 'full 阶段每次触发的 IP 数量（均分给8个分片）'
        required: false
        default: '10'
      total_max_requests:
        description: '全局总探活次数熔断限额'
        required: false
        default: '5500000'
      proxy_threshold:
        description: '节约原则阈值：proxy阶段找到多少个代理就跳过full'
        required: false
        default: '1'

permissions:
  contents: write
  actions: write

concurrency:
  group: proxy-scan
  cancel-in-progress: false

jobs:
  shard-0:
    runs-on: ubuntu-26.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests requests[socks]
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
      - name: 运行扫描 分片0
        env:
          MAX_RUNTIME_SEC: '20880'
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '30000' }}
          FULL_BATCH_SIZE: ${{ github.event.inputs.full_batch_size || '10' }}
          TOTAL_MAX_REQUESTS: ${{ github.event.inputs.total_max_requests || '5500000' }}
        run: |
          ulimit -n 65536
          echo "ulimit -n = $(ulimit -n)"
          python scanner.py --shard 0 --shard-total 8
      - name: 上传本分片 Artifact（第一优先级，先保住数据）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-0-files
          path: |
            working_proxies_shard0.txt
            progress_shard0.json
            open_ips_shard0.txt
            proxy_ips_shard0.txt
            open_ips_revalidated_shard0.txt
            proxy_missing_shard0.txt
            full_cursor_shard0.json
            scan_finished.flag
          if-no-files-found: ignore
      - name: 提交
        if: always()
        run: |
          for f in working_proxies_shard0.txt progress_shard0.json \
                   open_ips_shard0.txt proxy_ips_shard0.txt \
                   open_ips_revalidated_shard0.txt \
                   proxy_missing_shard0.txt \
                   full_cursor_shard0.json \
                   scan_finished.flag; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          git diff --staged --quiet || git commit -m "分片0 [skip ci]"
          git stash -u 2>/dev/null || true
          success=false
          for i in $(seq 1 10); do
            if git pull origin main --rebase && git push; then
              success=true; break
            fi
            git rebase --abort 2>/dev/null || true
            WAIT=$((RANDOM % 26 + 5))
            echo "重试 $i/10，等待 ${WAIT}s"
            sleep $WAIT
          done
          [ "$success" = "true" ] || exit 1

